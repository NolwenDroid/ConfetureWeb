<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b16">
    <meta name="robots" content="noindex">
    <meta name="description" content="Установите Confeture для iPhone или Android: знакомства с участниками, обмен контактами и расписание конференции по коду мероприятия.">
    <meta property="og:title" content="Установить Confeture">
    <meta property="og:description" content="Знакомьтесь с участниками, обменивайтесь контактами и смотрите расписание конференции.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:image" content="https://confeture.nolwendroid.ru/assets/og.png">
    <title>Установить Confeture — для iPhone и Android</title>
    <link rel="icon" href="../assets/app-icon.png">
    <link rel="stylesheet" href="../install.css">
  </head>
  <body>
    <div class="install-page">
      <main id="main" class="install-main">
        <div class="install-content">
          <h1>Установите <img class="install-wordmark" src="../assets/confeture-wordmark.svg" width="1346" height="285" alt="Confeture"></h1>
          <p class="install-lead">Знакомьтесь с участниками, обменивайтесь контактами и смотрите расписание конференции.</p>
          <p class="install-facts">Бесплатно <span aria-hidden="true">·</span> Без регистрации</p>

          <div class="store-options" role="group" aria-label="Выберите магазин приложений">
            <section class="store-option" aria-labelledby="iphone-title">
              <div class="store-option__meta">
                <h2 id="iphone-title">Для iPhone</h2>
                <p class="store-option__version" id="iphone-requirements">iOS 16.0 и новее</p>
              </div>
              <a class="store-link" href="https://apps.apple.com/app/id6811127313" aria-label="Загрузите Confeture в App Store" aria-describedby="iphone-requirements">
                <img class="store-badge" src="../assets/store-badges/app-store-ru.svg" width="120" height="40" alt="Загрузите в App Store">
              </a>
            </section>
            <section class="store-option" aria-labelledby="android-title">
              <div class="store-option__meta">
                <h2 id="android-title">Для Android</h2>
                <p class="store-option__version" id="android-requirements">Android 8.0 и новее</p>
              </div>
              <a class="store-link" href="https://play.google.com/store/apps/details?id=com.nolwendroid.confeture" aria-label="Скачать Confeture из Google Play" aria-describedby="android-requirements">
                <img class="store-badge" src="../assets/store-badges/google-play-ru.svg" width="239" height="71" alt="Скачать из Google Play">
              </a>
            </section>
          </div>
        </div>
      </main>

      <footer class="install-footer">
        <nav aria-label="Информация и поддержка">
          <a href="../">О приложении</a>
          <a href="../support.html">Помощь</a>
          <a href="../privacy-policy.html">Конфиденциальность</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
