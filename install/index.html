<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b16">
    <meta name="robots" content="noindex">
    <meta name="description" content="Установите Confeture для iPhone или Android. Находите участников рядом и обменивайтесь контактами на конференциях.">
    <meta property="og:title" content="Установить Confeture">
    <meta property="og:description" content="Участники рядом. Полезные знакомства. Контакты с вами после конференции.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:image" content="https://confeture.nolwendroid.ru/assets/og.png">
    <title>Установить Confeture — для iPhone и Android</title>
    <link rel="icon" href="../assets/app-icon.png">
    <link rel="stylesheet" href="../install.css">
  </head>
  <body>
    <div class="install-page">
      <header class="install-header">
        <a class="brand" href="../" aria-label="Confeture — главная страница">
          <img src="../assets/confeture-wordmark.svg" width="1346" height="285" alt="Confeture">
        </a>
        <a class="about-link" href="../">О приложении <span aria-hidden="true">↗</span></a>
      </header>

      <main id="main" class="install-main">
        <div class="install-content">
          <img class="app-icon" src="../assets/app-icon.png" width="80" height="80" alt="">
          <h1>Установите <img class="install-wordmark" src="../assets/confeture-wordmark.svg" width="1346" height="285" alt="Confeture"></h1>
          <p class="install-lead">Находите участников рядом<br class="desktop-break"> и обменивайтесь контактами.</p>

          <div class="store-options" aria-label="Выберите магазин приложений">
            <a class="store-option" href="https://apps.apple.com/app/id6811127313" aria-label="Скачать Confeture в App Store для iPhone">
              <span class="store-option__platform">Для iPhone <span class="store-option__version">iOS 16.0 и новее</span></span>
              <span class="store-option__artwork"><img class="store-badge store-badge--apple" src="../assets/store-badges/app-store-ru.svg" width="120" height="40" alt="Загрузите в App Store"></span>
            </a>
            <a class="store-option" href="https://play.google.com/store/apps/details?id=com.nolwendroid.confeture" aria-label="Скачать Confeture в Google Play для Android">
              <span class="store-option__platform">Для Android <span class="store-option__version">Android 8.0 и новее</span></span>
              <span class="store-option__artwork"><img class="store-badge store-badge--google" src="../assets/store-badges/google-play-ru.png" width="646" height="250" alt="Доступно в Google Play"></span>
            </a>
          </div>

          <p class="install-facts">Бесплатно <span aria-hidden="true">·</span> Без регистрации</p>
          <div class="getting-started">
            <span class="getting-started__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m7 12 3 3 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <p>После установки заполните профиль<br class="desktop-break"> и включите обмен в приложении.</p>
          </div>
        </div>
      </main>

      <footer class="install-footer">
        <a href="../support.html">Нужна помощь?</a>
        <span class="footer-divider" aria-hidden="true"></span>
        <a href="../privacy-policy.html">Конфиденциальность</a>
      </footer>
    </div>
  </body>
</html>
